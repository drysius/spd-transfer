[workspace]
resolver = "3"
members = ["spd-core", "spd-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Drysius/spd-transfer"

[workspace.dependencies]
spd-core = { path = "spd-core" }
anyhow = "1"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
jwalk = "0.8"
postcard = { version = "1", features = ["use-std"] }
# ring rather than aws-lc-rs: it builds without cmake/nasm, which keeps the Windows
# leg of the CI matrix from needing extra toolchain setup.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
rayon = "1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# No `zstdmt`: threading belongs to the pipeline, which already knows how many files are
# in flight. A second thread pool underneath it would compete with the first for cores.
zstd = { version = "0.13", default-features = false }

# Project rule: a warning is an error in CI (`-D warnings`). A new lint is configured
# here, never as an `#[allow]` scattered through the code.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
